name: Dispenser CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "dispenser/**"
      - ".github/workflows/dispenser-ci.yml"

jobs:
  unit:
    name: Unit and CLI checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dispenser

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dispenser/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run doctor
        run: npm run doctor
